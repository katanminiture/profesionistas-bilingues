function SiteButton({ variant = 'primary', size = 'md', inverse = false, onWhite = false, style, className, ...props }) {
  let resolved = variant;
  if (variant === 'accent' || variant === 'ghost') resolved = variant === 'ghost' ? 'secondary' : 'primary';

  const palette = inverse
    ? INVERSE_BTN
    : (onWhite ? LIGHT_BTN_ON_WHITE : LIGHT_BTN);

  const tone = palette[resolved] || palette.primary;

  const btn = (
    <Button
      variant={resolved}
      size={size}
      className={`site-btn site-btn--${resolved}${size === 'lg' ? ' site-btn--lg' : ''}${size === 'sm' ? ' site-btn--sm' : ''}`}
      style={{ boxShadow: 'none', borderRadius: '999px', fontWeight: 700, ...tone, ...style }}
      {...props}
    />
  );

  if (className) {
    return <span className={className} style={{ display: 'inline-flex' }}>{btn}</span>;
  }
  return btn;
}

function iconForLabel(label, map) {
  const lower = label.toLowerCase();
  for (const keys of map) {
    const icon = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i += 1) {
      if (lower.includes(keys[i].toLowerCase())) return icon;
    }
  }
  return 'spark';
}

function FeatureIcon({ name, size = 22 }) {
  const paths = FEATURE_ICON_PATHS[name] || FEATURE_ICON_PATHS.spark;
  return (
    <svg className="feature-icon" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {paths.map((d, i) => <path key={i} d={d} />)}
    </svg>
  );
}

function JourneyTimeline({ steps }) {
  const items = steps || [];
  return (
    <div className="step-path">
      <div className="step-path__connector" aria-hidden="true" />
      <ol className="step-path__list">
        {items.map(step => (
          <li
            key={step.num}
            className={`step-path__item${step.milestone ? ' step-path__item--milestone' : ''}${step.outcome ? ' step-path__item--outcome' : ''}`}
          >
            <span className="step-path__node" aria-hidden="true">{step.num}</span>
            <div className="step-path__body">
              <h4>{step.title}</h4>
              <p>{step.desc}</p>
            </div>
          </li>
        ))}
      </ol>
    </div>
  );
}

function EnglishLevelPath({ levels, label }) {
  const rows = levels || [];
  return (
    <ol className="english-level-path" aria-label={label}>
      {rows.map((row, index) => (
        <li key={row.tier} className="english-level-path__step">

function purchaseProgram(id, setView, source, lang) {
  if (window.PB_ANALYTICS) window.PB_ANALYTICS.programView(id, source || 'unknown');
  if (!isPurchasable(id)) {
    goToSection('contact', setView);
    return;
  }
  sessionStorage.setItem('pb-checkout-program', id);
  if (window.PB_ANALYTICS) window.PB_ANALYTICS.checkoutStart(id);
  if (payWithStripe(id)) return;
  const product = pricingProduct(id);
  if (product) checkoutMailto({ ...product, id }, lang || getSiteLang());

function checkoutMailto(product, lang) {
  const name = product.name[lang] || product.name.en;
  const price = window.PB_PRICING_HELPERS.displayPrice(product.id || sessionStorage.getItem('pb-checkout-program'), lang);
  const subject = encodeURIComponent(`Enrollment — ${name}`);
  const body = encodeURIComponent(
    `Hi Teresa,\n\nI would like to enroll in: ${name}\n${price ? `Price: ${price}\n` : ''}\nName:\nEmail:\n\nThank you.`
  );
  window.location.href = `mailto:teresa@palmlearning.com?subject=${subject}&body=${body}`;
}

function payWithStripe(id) {

function useScrollSpy(sectionIds, enabled) {
  const [activeId, setActiveId] = React.useState(null);

  React.useEffect(() => {
    if (!enabled) {
      setActiveId(null);
      return undefined;
    }

    const onScroll = () => {
      const offset = 120;
      let current = null;
      sectionIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top - offset <= 0) current = id;
      });
      setActiveId(current);
    };

    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [enabled, sectionIds.join('|')]);

  return activeId;
}

    if (!open) return undefined;
    const close = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);

    document.addEventListener('click', close);
    return () => document.removeEventListener('click', close);
  }, [open]);

  const active = isActiveGroup(menuKey, items);

  return (
    <div className={`nav-dropdown${open ? ' nav-dropdown--open' : ''}`} ref={ref}>
      <button
        type="button"
        className={`nav-link nav-dropdown__trigger${active ? ' nav-link--active' : ''}`}

      {open && (
        <div className="nav-dropdown__menu" role="menu">
          {items.map(item => (
            <button
              key={item.key}
              type="button"
              role="menuitem"
              className="nav-dropdown__item"
              onClick={() => { onSelect(item); setOpen(false); }}

        </div>

  );
}

function NewsletterSignup({ f }) {
  const [sent, setSent] = React.useState(false);
  const [error, setError] = React.useState('');
  const [submitting, setSubmitting] = React.useState(false);
  const formspreeId = window.PB_CONFIG && window.PB_CONFIG.formspreeId;

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    const form = e.target;
    const fd = new FormData(form);
    const email = fd.get('email');

    if (!formspreeId) {
      window.location.href = `mailto:teresa@palmlearning.com?subject=${encodeURIComponent('Newsletter signup')}&body=${encodeURIComponent(`Please add me to the newsletter: ${email}`)}`;
      return;
    }

    setSubmitting(true);
    try {
      const res = await fetch(`https://formspree.io/f/${formspreeId}`, {
        method: 'POST',
        body: fd,
        headers: { Accept: 'application/json' },
      });
      if (res.ok) setSent(true);
      else setError(f.newsletterError);
    } catch (err) {
      setError(f.newsletterError);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="footer-newsletter">
      <h4>{f.newsletterTitle}</h4>
      <p>{f.newsletterDesc}</p>
      {sent ? (
        <p className="footer-newsletter__success">{f.newsletterSuccess}</p>
      ) : (
        <form onSubmit={submit} className="footer-newsletter__form">
          <input type="hidden" name="_subject" value="Newsletter signup — Profesionistas Bilingües" />
          <input type="hidden" name="form_type" value="newsletter" />
          <input name="email" type="email" required placeholder={f.newsletterPlaceholder} aria-label={f.newsletterPlaceholder} />
          <button type="submit" disabled={submitting}>{submitting ? f.newsletterSending : f.newsletterSubmit}</button>
          {error && <p className="footer-newsletter__error">{error}</p>}
        </form>
      )}
    </div>
  );
}

function formatPrice(prog, h, lang) {
  const catalog = pricingProduct(prog.id);
  if (catalog && typeof catalog.display === 'string') {
    const period = catalog.period && (catalog.period[lang] || catalog.period.en);
    return catalog.display + (period ? ' ' + period : '');
  }
  if (prog.price === 'Contact us' || prog.price === 'Contáctanos') return prog.price;
  return (prog.pricePrefix ? h.priceFrom : '') + prog.price + (prog.period ? ' ' + prog.period : '');
}

function FAQSection({ t }) {
  const f = t.faq;
  const defaultOpen = React.useMemo(() => new Set((f.items || []).slice(0, 2).map(item => item.q)), [f.items]);
  const [open, setOpen] = React.useState(() => defaultOpen);

  const toggle = (key) => {
    setOpen(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  return (
    <SectionBlock id="faq" tone="white" labelledBy="faq-heading">
      <SectionHeader label={f.label || 'FAQ'} title={f.title} titleId="faq-heading" />
      <div className="faq-list">
          {f.items.map((item, i) => {
            const key = item.q;
            const isOpen = open.has(key);
            const panelId = 'faq-panel-' + i;
            const triggerId = 'faq-trigger-' + i;
            return (
              <div key={key} className={`faq-item${isOpen ? ' faq-item--open' : ''}`}>
                <button
                  type="button"
                  id={triggerId}
                  className="faq-item__trigger"
                  onClick={() => toggle(key)}
                  aria-expanded={isOpen}
                  aria-controls={panelId}
                >
                  <span className="faq-item__question">{item.q}</span>
                  <span className="faq-item__icon" aria-hidden="true">{isOpen ? '−' : '+'}</span>
                </button>
                <div
                  id={panelId}
                  className="faq-item__panel"
                  role="region"
                  aria-labelledby={triggerId}
                  hidden={!isOpen}
                >
                  <div className="faq-item__panel-inner">
                    <p>{item.a}</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
    </SectionBlock>
  );
}

function ContactSection({ t, standalone }) {
  const c = t.contact;
  const [sent, setSent] = React.useState(false);
  const [error, setError] = React.useState('');
  const [submitting, setSubmitting] = React.useState(false);
  const formspreeId = window.PB_CONFIG && window.PB_CONFIG.formspreeId;

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    const form = e.target;
    const fd = new FormData(form);

    if (!formspreeId) {
      const mailto = `mailto:${c.directEmail}?subject=${encodeURIComponent('Contact — Profesionistas Bilingües')}&body=${encodeURIComponent(
        `Name: ${fd.get('name')}\nEmail: ${fd.get('email')}\n\n${fd.get('comment')}`
      )}`;
      window.location.href = mailto;
      return;
    }

    setSubmitting(true);
    try {
      const res = await fetch(`https://formspree.io/f/${formspreeId}`, {
        method: 'POST',
        body: fd,
        headers: { Accept: 'application/json' },
      });
      if (res.ok) setSent(true);
      else setError(c.formError || 'Something went wrong. Please email us directly.');
    } catch (err) {
      setError(c.formError || 'Something went wrong. Please email us directly.');
    } finally {
      setSubmitting(false);
    }
  };

  const HeadingTag = standalone ? 'h1' : 'h2';
  return (
    <SectionBlock id="contact" tone="white" className="contact-section">
      <header className="section-block__header">
        <SectionLabel>{c.label}</SectionLabel>
        <HeadingTag className="section-block__title">{c.title}</HeadingTag>
        <p className="section-block__lead">{c.subtitle}</p>
      </header>
      <div className="contact-form-wrap">
          {sent ? (
            <StatusBanner variant="success" title={c.formSuccessTitle || null}>
              {c.formSuccess}
            </StatusBanner>
          ) : (
            <form className="contact-form" onSubmit={submit}>
              <label className="contact-form__field">
                <span className="contact-form__label">{c.formName}</span>
                <input name="name" required placeholder={c.formNamePlaceholder} aria-invalid={error ? 'true' : undefined} />
              </label>
              <label className="contact-form__field">
                <span className="contact-form__label">{c.formEmail}</span>
                <input name="email" type="email" required placeholder={c.formEmailPlaceholder} aria-invalid={error ? 'true' : undefined} />
              </label>
              <label className="contact-form__field">
                <span className="contact-form__label">{c.formComment}</span>
                <textarea name="comment" required rows={5} placeholder={c.formCommentPlaceholder} aria-invalid={error ? 'true' : undefined} />
              </label>
              {error && (
                <StatusBanner variant="error" title={c.formErrorTitle || null} className="contact-form__status">
                  {error}
                </StatusBanner>
              )}
              <SiteButton variant="primary" type="submit" disabled={submitting} style={{ width: '100%' }}>
                {submitting ? c.formSending : c.formSubmit}
              </SiteButton>
            </form>
          )}
          <p className="contact-direct">
            {c.directLine}{' '}
            <a href={`mailto:${c.directEmail}`}>{c.directEmail}</a>
          </p>
        </div>
    </SectionBlock>
  );
}

function LegalPage({ t, pageKey, setView }) {
  const page = t[pageKey];
  const crumbs = [
    { label: t.breadcrumbs.home, onClick: () => goToSection('top', setView) },
    { label: t.pageTitles[pageKey] || page.title },
  ];
  return (
    <div style={{ fontFamily: 'var(--font-body)' }}>
      <div className="container page-shell">
        <PageBreadcrumbs t={t} items={crumbs} />
      </div>
      <div className="page-header">
        <h1>{page.title}</h1>
        <p style={{ fontSize: 'var(--text-sm)' }}>{page.updated}</p>
      </div>
      <div className="legal-content">
        {page.sections.map(s => (
          <div key={s.heading}>
            <h2>{s.heading}</h2>
            <p>{s.body}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function ResourcesPage({ setView, t, lang }) {
  const r = t.resources;
  const catalog = window.RESOURCE_CATALOG || {};
  const crumbs = [
    { label: t.breadcrumbs.home, onClick: () => goToSection('top', setView) },
    { label: t.pageTitles.resources },
  ];

  return (
    <div style={{ fontFamily: 'var(--font-body)' }}>
      <div className="container page-shell">
        <PageBreadcrumbs t={t} items={crumbs} />
      </div>
      <div className="page-hero-band page-hero-band--compact">
        <SectionLabel light>{r.title}</SectionLabel>
        <h1>{r.title}</h1>
        <p>{r.subtitle}</p>
      </div>
      <div className="container section">
        <p className="resource-page-intro">{r.intro}</p>
        <div className="resource-grid">
          {r.categories.map(cat => {
            const meta = catalog[cat.id] || {};
            const primaryLink = cat.links && cat.links[0];
            const imageAlt = (meta.imageAlt && (meta.imageAlt[lang] || meta.imageAlt.en)) || cat.name;
            return (
              <Card key={cat.id} className="resource-card" padding="0" style={{ overflow: 'hidden' }} id={`resource-${cat.id}`}>
                {meta.image && (
                  <div className="resource-card__media">
                    <img src={meta.image} alt={imageAlt} loading="lazy" decoding="async" />
                    {meta.icon && (
                      <span className="resource-card__media-icon" aria-hidden="true">
                        <FeatureIcon name={meta.icon} size={22} />
                      </span>
                    )}
                  </div>
                )}
                <div className="resource-card__content">
                  <MetaLabel accent>{cat.name}</MetaLabel>
                  <p className="resource-card__desc">{cat.desc}</p>
                  <div className="resource-card__lesson">
                    <span className="resource-card__lesson-label">{r.guideLabel}</span>
                    <p>{cat.lesson}</p>
                  </div>
                  {primaryLink && (
                    <a
                      className="resource-card__cta"
                      href={primaryLink.url}
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      {r.cardCta}
                    </a>
                  )}
                  <div className="resource-card__links">
                    <span className="resource-card__links-label">{r.linksLabel}</span>
                    <ul>
                      {cat.links.map(link => (
                        <li key={link.url}>
                          <a href={link.url} target="_blank" rel="noopener noreferrer">{link.label}</a>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
        <div className="resource-page-cta">
          <p>{r.cta}</p>
          <SiteButton variant="primary" onWhite onClick={() => goToSection('programs', setView)}>{r.ctaBtn}</SiteButton>
        </div>
      </div>
    </div>
  );
}

function Buy({ setView, t, lang }) {
  const b = t.buy;
  const programId = sessionStorage.getItem('pb-checkout-program') || '8-week';
  const product = pricingProduct(programId);
  const cohort = window.PB_PRICING.nextCohort[lang];
  const stripeReady = window.PB_PRICING_HELPERS.hasStripeLink(programId);
  const priceDisplay = window.PB_PRICING_HELPERS.displayPrice(programId, lang) || product?.display;
  const paymentFailed = typeof window !== 'undefined' && window.location.hash.includes('payment=failed');

  React.useEffect(() => {
    if (!product || !isPurchasable(programId)) {
      goToSection('programs', setView);
      return;
    }
    if (stripeReady && !paymentFailed) payWithStripe(programId);
  }, [programId, product, stripeReady, paymentFailed]);

  if (!product || !isPurchasable(programId)) return null;

  const pay = () => {
    if (payWithStripe(programId)) return;
    checkoutMailto({ ...product, id: programId }, lang);
  };

  return (
    <div style={{ fontFamily: 'var(--font-body)' }}>
      <div className="page-hero-band">
        <SectionLabel light>{b.title}</SectionLabel>
        <h1>{b.title}</h1>
        <p>{b.subtitle}</p>
      </div>
      <div className="container section">
        {paymentFailed && (
          <StatusBanner variant="error" title={b.paymentFailedTitle} className="buy-page__status">
            {b.paymentFailedBody}
          </StatusBanner>
        )}
        {!stripeReady && (
          <StatusBanner variant="warning" className="buy-page__status">
            {b.stripePending}
          </StatusBanner>
        )}
        <Card style={{ maxWidth: '560px', margin: '0 auto' }}>
          <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--text-lg)', margin: '0 0 16px' }}>{b.orderTitle}</h2>
          <div style={{ borderBottom: '1px solid var(--border-default)', paddingBottom: '16px', marginBottom: '16px' }}>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--text-base)' }}>{product.name[lang]}</div>
            <p style={{ margin: '8px 0 0', color: 'var(--text-secondary)', fontSize: 'var(--text-sm)', lineHeight: 'var(--leading-base)' }}>{product.summary[lang]}</p>
            <p style={{ margin: '12px 0 0', fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
              {b.cohortLabel}: <strong style={{ color: 'var(--text-primary)' }}>{cohort}</strong>
            </p>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '20px' }}>
            <span style={{ fontWeight: 600 }}>{b.totalLabel}</span>
            <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: '28px' }}>{priceDisplay}</span>
          </div>
          <SiteButton variant="primary" style={{ width: '100%' }} onClick={pay}>
            {paymentFailed ? b.paymentFailedCta : (stripeReady ? b.payNowCta : b.continueCta)}
          </SiteButton>
          {stripeReady && !paymentFailed && (
            <p style={{ margin: '12px 0 0', fontSize: 'var(--text-xs)', color: 'var(--text-secondary)', textAlign: 'center' }}>{b.payNote}</p>
          )}
          <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', marginTop: '20px', flexWrap: 'wrap' }}>
            <SiteButton variant="ghost" size="sm" onClick={() => goToSection('programs', setView)}>{b.backCta}</SiteButton>
            {!stripeReady && (
              <SiteButton variant="ghost" size="sm" onClick={() => openCalendly('buy')}>{t.nav.bookCall}</SiteButton>
            )}
          </div>
        </Card>
        <p style={{ textAlign: 'center', marginTop: '20px', fontSize: 'var(--text-xs)', color: 'var(--text-secondary)' }}>{b.secureNote}</p>
      </div>
    </div>
  );
}

function Checkout({ setView, t, lang }) {
  const c = t.checkout;
  const programId = sessionStorage.getItem('pb-checkout-program') || '8-week';
  const product = pricingProduct(programId);
  const cohort = window.PB_PRICING.nextCohort[lang];

  return (
    <div style={{ fontFamily: 'var(--font-body)' }}>
      <div className="page-header text-center" style={{ textAlign: 'center', paddingBottom: '16px' }}>
        <h1>{c.title}</h1>
        <p style={{ margin: '8px auto 0' }}>{c.subtitle}</p>
      </div>
      <div className="container">
        <StatusBanner variant="success" title={c.successTitle || c.title} className="checkout-page__status">
          {c.subtitle}
        </StatusBanner>
        <Card style={{ maxWidth: '560px', margin: '0 auto 24px' }}>
          <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--text-lg)', margin: '0 0 12px' }}>{c.cohortTitle}</h2>
          {product && (
            <p style={{ margin: '0 0 8px', color: 'var(--text-secondary)', fontSize: 'var(--text-sm)' }}>
              {c.programLabel}: <strong style={{ color: 'var(--text-primary)' }}>{product.name[lang]}</strong>
            </p>
          )}
          <p style={{ margin: 0, fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--text-base)' }}>
            {c.cohortStarts || cohort}
          </p>
        </Card>
        <Card style={{ maxWidth: '560px', margin: '0 auto' }}>
          <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--text-lg)', margin: '0 0 16px' }}>{c.stepsTitle}</h2>
          <ol className="checkout-steps" style={{ margin: 0, paddingLeft: '20px', lineHeight: '2', color: 'var(--text-secondary)' }}>
            {c.steps.map(step => <li key={step}>{step}</li>)}
          </ol>
        </Card>
        <p style={{ textAlign: 'center', marginTop: '24px', color: 'var(--text-secondary)' }}>{c.questions}</p>
        <div style={{ textAlign: 'center', marginTop: '16px' }}>
          <SiteButton variant="primary" onClick={() => goToSection('top', setView)}>{c.homeBtn}</SiteButton>
        </div>
      </div>
    </div>
  );
}

function App() {
  const router = window.PB_ROUTER;
  const parsed = router.parse();
  const [view, setViewState] = React.useState(parsed.view);
  const [lang, setLangState] = React.useState(parsed.lang);
  const t = useContent(lang);

  const setView = (v, replace) => {
    if (!router.VIEWS.includes(v)) v = 'home';
    const next = router.navigate(lang, v, replace);
    setViewState(next.view);
    const section = sectionForView(next.view);
    if (section) {
      requestAnimationFrame(() => setTimeout(() => scrollToSection(section), 80));
    } else if (!isLandingView(next.view)) {
      window.scrollTo(0, 0);
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    if (window.PB_ANALYTICS) window.PB_ANALYTICS.pageView(next.lang, next.view);
    router.updateHreflang(next.lang, next.view);
  };

  const setLang = (nextLang) => {
    localStorage.setItem('pb-lang', nextLang);
    const next = router.navigate(nextLang, view, true);
    setLangState(next.lang);
    if (window.PB_ANALYTICS) window.PB_ANALYTICS.pageView(next.lang, next.view);
    router.updateHreflang(next.lang, next.view);
  };

  React.useEffect(() => {
    router.navigate(lang, view, true);
    router.updateHreflang(lang, view);
    const section = sectionForView(view);
    if (section) setTimeout(() => scrollToSection(section), 150);
  }, []);

  React.useEffect(() => {
    document.title = pageTitleForView(t, view);
    document.documentElement.lang = lang;
    const skip = document.querySelector('.skip-link');
    if (skip && t.a11y) skip.textContent = t.a11y.skipToContent;
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.content = t.meta.description;
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.content = pageTitleForView(t, view);
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.content = t.meta.description;
    router.updateHreflang(lang, view);

    const main = document.getElementById('main-content');
    if (main && !isLandingView(view)) main.focus({ preventScroll: true });

    const origin = window.location.origin;
    const base = router.siteBase();
    let canonical = document.getElementById('canonical-link');
    if (!canonical) {
      canonical = document.createElement('link');
      canonical.id = 'canonical-link';
      canonical.rel = 'canonical';
      document.head.appendChild(canonical);
    }
    canonical.href = origin + base + lang + (router.SLUGS[lang][view] ? '/' + router.SLUGS[lang][view] : '');

    const ogImage = document.querySelector('meta[property="og:image"]');
    if (ogImage) ogImage.content = origin + base + 'assets/hero-professional.png';

    let ld = document.getElementById('pb-structured-data');
    if (!ld) {
      ld = document.createElement('script');
      ld.id = 'pb-structured-data';
      ld.type = 'application/ld+json';
      document.head.appendChild(ld);
    }
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@graph': [
        {
          '@type': 'Organization',
          name: 'Profesionistas Bilingües',
          parentOrganization: { '@type': 'Organization', name: 'Palm Learning Center' },
          url: origin + base,
          email: 'info@profesionistasbilingues.com',
          sameAs: (t.social.items || []).map(item => item.url),
        },
        {
          '@type': 'Course',
          name: '8-Week Bilingual Workforce Performance Program',
          description: t.meta.description,
          provider: { '@type': 'Organization', name: 'Palm Learning Center' },
          offers: {
            '@type': 'Offer',
            price: '1297',
            priceCurrency: 'USD',
            availability: 'https://schema.org/InStock',
          },
        },
      ],
    });

    if (window.PB_ANALYTICS) window.PB_ANALYTICS.pageView(lang, view);
  }, [lang, view, t]);

  React.useEffect(() => {
    if (window.PB_CONSENT && t.consent) window.PB_CONSENT.mount(t.consent);
  }, [t]);

  React.useEffect(() => {
    localStorage.setItem('pb-lang', lang);
  }, [lang]);

  React.useEffect(() => {
    const syncRoute = () => {
      const p = router.parse();
      setViewState(p.view);
      setLangState(p.lang);
      const section = sectionForView(p.view);
      if (section && isLandingView(p.view)) {
        setTimeout(() => scrollToSection(section), 120);
      } else if (isLandingView(p.view) && p.view === 'home') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
    window.addEventListener('popstate', syncRoute);
    window.addEventListener('hashchange', syncRoute);
    return () => {
      window.removeEventListener('popstate', syncRoute);
      window.removeEventListener('hashchange', syncRoute);
    };
  }, []);

  const utilityScreens = {
    contact: () => <ContactPage t={t} setView={setView} />,
    privacy: () => <LegalPage t={t} pageKey="privacy" setView={setView} />,
    terms: () => <LegalPage t={t} pageKey="terms" setView={setView} />,
    resources: () => <ResourcesPage setView={setView} t={t} lang={lang} />,
    checkout: Checkout,
    buy: Buy,
  };

  const scrollSectionIds = HOME_SCROLL_SECTIONS.map(s => s.id);
  const activeSectionId = useScrollSpy(scrollSectionIds, view === 'home');

  const Screen = isLandingView(view)
    ? LandingPage
    : (utilityScreens[view] || LandingPage);

  return (
    <div className="site-wrap site-wrap--mockup">
      <NavBar view={view} setView={setView} lang={lang} setLang={setLang} t={t} activeSectionId={activeSectionId} />
      <main id="main-content" className="site-main" tabIndex={-1}>
        <Screen setView={setView} t={t} lang={lang} activeSectionId={activeSectionId} />
      </main>
      <Footer setView={setView} lang={lang} setLang={setLang} t={t} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
